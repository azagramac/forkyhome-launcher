name: 🔨 Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: 🤖 Compilar APK Debug
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar código fuente
        uses: actions/checkout@v7

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 🐘 Configurar Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14

      - name: 🛠️ Compilar APK debug
        run: gradle assembleDebug -PversionCode="${{ github.run_number }}" --stacktrace

      - name: 📊 Generar resumen de compilación
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          APK_NAME=$(basename "$APK_FILE")
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
          {
            echo "### 🤖 Resultado de compilación (Debug)"
            echo "| Campo | Valor |"
            echo "| :--- | :--- |"
            echo "| 📦 **Archivo** | \`$APK_NAME\` |"
            echo "| 📏 **Tamaño** | \`$APK_SIZE\` |"
            echo "| 🔢 **Version Code** | \`${{ github.run_number }}\` |"
            echo "| 🔒 **SHA-256** | \`$APK_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Subir artefacto APK
        uses: actions/upload-artifact@v7
        with:
          name: launcher-aosp-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
