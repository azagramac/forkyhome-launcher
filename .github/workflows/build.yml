name: 🔨 Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: 🤖 Compilar APK Debug
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: 📥 Descargar código fuente
        uses: actions/checkout@v7

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 🐘 Configurar Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14

      - name: 🔐 Preparar firma debug
        env:
          KEYSTORE_DEBUG_B64: ${{ secrets.ANDROID_KEYSTORE_DEBUG_BASE64 }}
          KEYSTORE_FALLBACK_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          B64="${KEYSTORE_DEBUG_B64:-$KEYSTORE_FALLBACK_B64}"
          if [ -n "$B64" ]; then
            JKS="$RUNNER_TEMP/debug.jks"
            echo "$B64" | base64 -d > "$JKS"
            echo "KEYSTORE_FILE=$JKS" >> "$GITHUB_ENV"
            if [ -z "$KEY_ALIAS" ] || ! keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              DETECTED_ALIAS=$(keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i "PrivateKeyEntry" | head -n1 | cut -d',' -f1)
              [ -n "$DETECTED_ALIAS" ] && echo "KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
            fi
            echo "SIGNING_MODE=🔐 Keystore debug propio (ANDROID_KEYSTORE_DEBUG_BASE64)" >> "$GITHUB_ENV"
            echo "✅ Firmando con tu keystore debug personalizado."
          else
            echo "SIGNING_MODE=⚠️ Clave debug temporal del runner" >> "$GITHUB_ENV"
            echo "ℹ️ Sin secret ANDROID_KEYSTORE_DEBUG_BASE64: usando clave debug temporal."
          fi

      - name: 🛠️ Compilar APK debug
        run: gradle assembleDebug -PversionCode="${{ github.run_number }}" --stacktrace

      - name: 📊 Generar resumen de compilación
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          APK_NAME=$(basename "$APK_FILE")
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
          {
            echo "### 🤖 Resultado de compilación (Debug)"
            echo "| Campo | Valor |"
            echo "| :--- | :--- |"
            echo "| 📦 **Archivo** | \`$APK_NAME\` |"
            echo "| 📏 **Tamaño** | \`$APK_SIZE\` |"
            echo "| 🔢 **Version Code** | \`${{ github.run_number }}\` |"
            echo "| 🔑 **Firma** | $SIGNING_MODE |"
            echo "| 🔒 **SHA-256** | \`$APK_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Limpiar keystore temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.jks"

      - name: 📦 Subir artefacto APK
        uses: actions/upload-artifact@v7
        with:
          name: launcher-aosp-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
