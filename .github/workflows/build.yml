name: 🔨 Build & Test (Debug)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: 🤖 Build Debug APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 🐘 Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14

      - name: 🔐 Prepare Debug Signing Keystore
        env:
          KEYSTORE_DEBUG_B64: ${{ secrets.ANDROID_KEYSTORE_DEBUG_BASE64 }}
          KEYSTORE_FALLBACK_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          B64="${KEYSTORE_DEBUG_B64:-$KEYSTORE_FALLBACK_B64}"
          if [ -z "$B64" ]; then
            echo "::error::❌ Missing ANDROID_KEYSTORE_DEBUG_BASE64 (or KEYSTORE_BASE64) secret in GitHub Secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::❌ Missing KEYSTORE_PASSWORD secret in GitHub Secrets."
            exit 1
          fi
          JKS="$RUNNER_TEMP/debug.jks"
          echo "$B64" | base64 -d > "$JKS"
          echo "KEYSTORE_FILE=$JKS" >> "$GITHUB_ENV"
          if [ -z "$KEY_ALIAS" ] || ! keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            DETECTED_ALIAS=$(keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i "PrivateKeyEntry" | head -n1 | cut -d',' -f1)
            [ -n "$DETECTED_ALIAS" ] && echo "KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
          fi
          echo "✅ Debug keystore loaded from GitHub Secrets."

      - name: 🧪 Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: 🛠️ Build Debug APK
        run: gradle assembleDebug -PversionCode="${{ github.run_number }}" --stacktrace

      - name: 📊 Generate Build & Test Summary
        if: always()
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          APK_NAME=$([ -n "$APK_FILE" ] && basename "$APK_FILE" || echo "N/A")
          APK_SIZE=$([ -n "$APK_FILE" ] && du -h "$APK_FILE" | cut -f1 || echo "N/A")
          APK_SHA256=$([ -n "$APK_FILE" ] && sha256sum "$APK_FILE" | cut -d' ' -f1 || echo "N/A")

          python3 - "$APK_NAME" "$APK_SIZE" "${{ github.run_number }}" "$APK_SHA256" >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          apk_name, apk_size, run_number, apk_sha256 = sys.argv[1:5]
          xml_files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))

          total_tests = 0
          total_failures = 0
          total_skipped = 0
          total_time_s = 0.0
          cases = []

          for path in xml_files:
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for suite in suites:
                  for tc in suite.findall("testcase"):
                      name = tc.attrib.get("name", "unknown")
                      cls = tc.attrib.get("classname", "").split(".")[-1]
                      t_sec = float(tc.attrib.get("time", "0") or 0.0)
                      total_tests += 1
                      total_time_s += t_sec
                      if tc.find("failure") is not None or tc.find("error") is not None:
                          status = "❌ Failed"
                          total_failures += 1
                      elif tc.find("skipped") is not None:
                          status = "⏭️ Skipped"
                          total_skipped += 1
                      else:
                          status = "✅ Passed"
                      cases.append((status, cls, name, t_sec))

          passed = total_tests - total_failures - total_skipped
          total_ms = total_time_s * 1000.0
          overall_badge = "✅ Passed" if total_failures == 0 and total_tests > 0 else ("❌ Failed" if total_failures > 0 else "⚠️ No tests")

          print("### 🤖 Debug Build & Unit Tests Summary")
          print("| Field | Value |")
          print("| :--- | :--- |")
          print(f"| 🧪 **Unit Tests** | {overall_badge} (`{passed}/{total_tests}` passed in `{total_ms:.2f} ms`) |")
          print(f"| 📦 **Artifact** | `{apk_name}` |")
          print(f"| 📏 **Size** | `{apk_size}` |")
          print(f"| 🔢 **Version Code** | `{run_number}` |")
          print("| 🔑 **Signing** | 🔐 Debug Keystore (`ANDROID_KEYSTORE_DEBUG_BASE64`) |")
          print(f"| 🔒 **SHA-256** | `{apk_sha256}` |")
          print()

          if cases:
              print("### 🧪 Unit Tests Breakdown")
              print("| Status | Suite | Test Case | Time |")
              print("| :---: | :--- | :--- | ---: |")
              for status, cls, name, t_sec in cases:
                  ms = t_sec * 1000.0
                  time_str = f"{ms:.2f} ms" if ms < 1000 else f"{t_sec:.3f} s"
                  print(f"| {status} | `{cls}` | `{name}` | `{time_str}` |")
          EOF

      - name: 🧹 Clean up Keystore from Runner
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.jks"

      - name: 📦 Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: launcher-aosp-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
