name: 🔨 ForkyHome Debug (Testing)

on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-release:
    name: 🤖 Build, Test & Publish Testing Release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 🐘 Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14

      - name: 🔐 Prepare Debug Signing Keystore
        env:
          KEYSTORE_DEBUG_B64: ${{ secrets.ANDROID_KEYSTORE_DEBUG_BASE64 }}
          KEYSTORE_FALLBACK_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          B64="${KEYSTORE_DEBUG_B64:-$KEYSTORE_FALLBACK_B64}"
          if [ -z "$B64" ]; then
            echo "::error::❌ Missing ANDROID_KEYSTORE_DEBUG_BASE64 (or KEYSTORE_BASE64) secret in GitHub Secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::❌ Missing KEYSTORE_PASSWORD secret in GitHub Secrets."
            exit 1
          fi
          JKS="$RUNNER_TEMP/debug.jks"
          echo "$B64" | base64 -d > "$JKS"
          chmod 600 "$JKS"
          echo "KEYSTORE_FILE=$JKS" >> "$GITHUB_ENV"
          if [ -z "$KEY_ALIAS" ] || ! keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            DETECTED_ALIAS=$(keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i "PrivateKeyEntry" | head -n1 | cut -d',' -f1)
            if [ -n "$DETECTED_ALIAS" ]; then
              echo "::add-mask::$DETECTED_ALIAS"
              echo "KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
            fi
          fi
          echo "✅ Debug keystore loaded from GitHub Secrets."

      - name: 🧪 Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: 🛠️ Build Debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug -PversionCode="${{ github.run_number }}" --stacktrace

      - name: 📦 Prepare Debug Artifacts & SHA-256 Checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/
          cd dist
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done
          ls -lh

      - name: 📝 Generate Changelog (Commits & Issues since last testing upload)
        run: |
          git fetch --tags --force || true
          PREV_COMMIT=$(git rev-list -n 1 testing 2>/dev/null || true)
          if [ -n "$PREV_COMMIT" ] && [ "$PREV_COMMIT" != "${{ github.sha }}" ]; then
            RANGE="${PREV_COMMIT}..HEAD"
          else
            RANGE="-n 20 HEAD"
          fi

          python3 - "$RANGE" "${{ github.ref_name }}" "${{ github.run_number }}" > release_notes.md << 'EOF'
          import re
          import subprocess
          import sys

          git_range, branch, run_num = sys.argv[1:4]
          cmd = ["git", "log"] + git_range.split() + ["--no-merges", "--pretty=format:%h|%s|%b%x1e"]
          raw = subprocess.check_output(cmd, text=True, errors="replace")

          commits = []
          issues = set()
          for entry in raw.split("\x1e"):
              entry = entry.strip()
              if not entry:
                  continue
              parts = entry.split("|", 2)
              sha = parts[0]
              subj = parts[1] if len(parts) > 1 else ""
              body = parts[2] if len(parts) > 2 else ""
              commits.append(f"- {subj} (`{sha}`)")
              for m in re.findall(r"#(\d+)", f"{subj}\n{body}"):
                  issues.add(int(m))

          print(f"## 🧪 ForkyHome Testing (Build #{run_num} · `{branch}`)\n")
          print("### 📋 Issues")
          if issues:
              for num in sorted(issues):
                  print(f"- #{num}")
          else:
              print("- No referenced issues since last upload.")
          print("\n### 📝 Commits")
          if commits:
              print("\n".join(commits))
          else:
              print("- No new commits since last upload.")
          EOF
          cat release_notes.md

      - name: 📊 Generate Build & Test Summary
        if: always()
        run: |
          APK_FILE=$(ls dist/*.apk 2>/dev/null | head -n 1)
          APK_NAME=$([ -n "$APK_FILE" ] && basename "$APK_FILE" || echo "N/A")
          APK_SIZE=$([ -n "$APK_FILE" ] && du -h "$APK_FILE" | cut -f1 || echo "N/A")
          APK_SHA256=$([ -n "$APK_FILE" ] && sha256sum "$APK_FILE" | cut -d' ' -f1 || echo "N/A")

          {
            echo "### 🤖 ForkyHome Debug Build Summary"
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| 🌿 **Branch** | \`${{ github.ref_name }}\` |"
            echo "| 📦 **Artifact** | \`$APK_NAME\` |"
            echo "| 📏 **Size** | \`$APK_SIZE\` |"
            echo "| 🔢 **Version Code** | \`${{ github.run_number }}\` |"
            echo "| 🔑 **Signing** | 🔐 Debug Keystore |"
            echo "| 🔒 **SHA-256** | \`$APK_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Clean up Keystore from Runner
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/debug.jks" ]; then
            shred -u -z "$RUNNER_TEMP/debug.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/debug.jks"
          fi
          echo "KEYSTORE_FILE=" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=" >> "$GITHUB_ENV"

      - name: 🚀 Publish Testing GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: testing
          target_commitish: ${{ github.sha }}
          name: ForkyHome Testing
          body_path: release_notes.md
          prerelease: true
          make_latest: false
          files: |
            dist/*.apk
            dist/*.apk.sha256

      - name: 📲 Send Debug APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DEBUG }}
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          APK_FILE=$(ls dist/*.apk | head -n 1)
          CAPTION="🧪 ForkyHome Testing (Build #${{ github.run_number }} · ${{ github.ref_name }})"
          RESP_FILE="$RUNNER_TEMP/tg_resp.json"
          HTTP_CODE=$(curl -sS --http1.1 --connect-timeout 15 --max-time 120 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -o "$RESP_FILE" -w "%{http_code}" -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_FILE}" \
            -F "caption=${CAPTION}")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::⚠️ Telegram upload failed with HTTP status $HTTP_CODE: $(cat "$RESP_FILE" 2>/dev/null)"
            rm -f "$RESP_FILE"
            exit 1
          fi
          rm -f "$RESP_FILE"

      - name: 🔒 Final Runner Secret & Workspace Cleanup
        if: always()
        run: |
          rm -rf dist release_notes.md "$RUNNER_TEMP"/*.jks
