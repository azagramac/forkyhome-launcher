name: 🚀 ForkyHome Release

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: 📦 Build & Publish Release
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏷️ Resolve Release Version
        run: |
          V="0.1.${{ github.run_number }}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"
          echo "📌 Resolved version: v$V"

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 🐘 Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14

      - name: 🔐 Prepare Release Signing Keystore
        env:
          KEYSTORE_RELEASE_B64: ${{ secrets.ANDROID_KEYSTORE_RELEASE_BASE64 }}
          KEYSTORE_FALLBACK_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          B64="${KEYSTORE_RELEASE_B64:-$KEYSTORE_FALLBACK_B64}"
          if [ -z "$B64" ]; then
            echo "::error::❌ Missing ANDROID_KEYSTORE_RELEASE_BASE64 (or KEYSTORE_BASE64) secret in GitHub Secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::❌ Missing KEYSTORE_PASSWORD secret in GitHub Secrets."
            exit 1
          fi
          JKS="$RUNNER_TEMP/release.jks"
          echo "$B64" | base64 -d > "$JKS"
          chmod 600 "$JKS"
          echo "KEYSTORE_FILE=$JKS" >> "$GITHUB_ENV"
          if [ -z "$KEY_ALIAS" ] || ! keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            DETECTED_ALIAS=$(keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i "PrivateKeyEntry" | head -n1 | cut -d',' -f1)
            if [ -n "$DETECTED_ALIAS" ]; then
              echo "::add-mask::$DETECTED_ALIAS"
              echo "KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
            fi
          fi
          echo "✅ Production keystore loaded from GitHub Secrets."

      - name: 🧪 Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: 🛠️ Build Release APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease -PversionName="$VERSION" -PversionCode="${{ github.run_number }}" --stacktrace

      - name: 📦 Prepare Release Artifacts & SHA-256 Checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/bundle/release/*.aab dist/
          cd dist
          for f in *.apk *.aab; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -lh

      - name: 📝 Generate PR-Only Changelog (Commits & Issues)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - > release_notes.md << 'EOF'
          import os
          import re
          import subprocess

          pr_num = os.environ["PR_NUMBER"]
          pr_title = os.environ.get("PR_TITLE", "")
          pr_body = os.environ.get("PR_BODY", "")
          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]

          cmd = ["git", "log", f"{base_sha}..{head_sha}", "--no-merges", "--pretty=format:%h|%s|%b%x1e"]
          raw = subprocess.check_output(cmd, text=True, errors="replace")

          commits = []
          issues = set()
          for m in re.findall(r"#(\d+)", f"{pr_title}\n{pr_body}"):
              issues.add(int(m))

          for entry in raw.split("\x1e"):
              entry = entry.strip()
              if not entry:
                  continue
              parts = entry.split("|", 2)
              sha = parts[0]
              subj = parts[1] if len(parts) > 1 else ""
              body = parts[2] if len(parts) > 2 else ""
              commits.append(f"- {subj} (`{sha}`)")
              for m in re.findall(r"#(\d+)", f"{subj}\n{body}"):
                  issues.add(int(m))

          print(f"## 🚀 ForkyHome {os.environ.get('TAG', '')} (PR #{pr_num}: {pr_title})\n")
          print("### 📋 Issues")
          if issues:
              for num in sorted(issues):
                  print(f"- #{num}")
          else:
              print("- No referenced issues in this pull request.")
          print("\n### 📝 Pull Request Commits")
          if commits:
              print("\n".join(commits))
          else:
              print("- No commits found in pull request range.")
          EOF
          cat release_notes.md

      - name: 📊 Generate Release Summary
        if: always()
        run: |
          APK_FILE=$(ls dist/*.apk 2>/dev/null | head -n 1)
          APK_NAME=$([ -n "$APK_FILE" ] && basename "$APK_FILE" || echo "N/A")
          APK_SIZE=$([ -n "$APK_FILE" ] && du -h "$APK_FILE" | cut -f1 || echo "N/A")
          APK_SHA256=$([ -n "$APK_FILE" ] && cut -d' ' -f1 "$APK_FILE.sha256" || echo "N/A")
          {
            echo "### 🚀 ForkyHome Release Summary (\`$TAG\`)"
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| 🧪 **Unit Tests** | ✅ Passed |"
            echo "| 🏷️ **Version** | \`$VERSION\` (\`versionCode: ${{ github.run_number }}\`) |"
            echo "| 📦 **APK** | \`$APK_NAME\` |"
            echo "| 📏 **Size** | \`$APK_SIZE\` |"
            echo "| 🔑 **Signing** | 🔐 Production Keystore (\`ANDROID_KEYSTORE_RELEASE_BASE64\`) |"
            echo "| 🔒 **SHA-256** | \`$APK_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Clean up Keystore from Runner
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release.jks" ]; then
            shred -u -z "$RUNNER_TEMP/release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/release.jks"
          fi
          echo "KEYSTORE_FILE=" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=" >> "$GITHUB_ENV"

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          name: ForkyHome ${{ env.TAG }}
          body_path: release_notes.md
          make_latest: true
          files: |
            dist/*.apk
            dist/*.apk.sha256
            dist/*.aab
            dist/*.aab.sha256

      - name: 📲 Send Release APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_RELEASE }}
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          APK_FILE=$(ls dist/*.apk | head -n 1)
          CAPTION="🚀 ForkyHome ${TAG} (PR #${{ github.event.pull_request.number }})"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_FILE}" \
            -F "caption=${CAPTION}")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::❌ Telegram upload failed with HTTP status $HTTP_CODE"
            exit 1
          fi

      - name: 🔒 Final Runner Secret & Workspace Cleanup
        if: always()
        run: |
          rm -rf dist release_notes.md "$RUNNER_TEMP"/*.jks
