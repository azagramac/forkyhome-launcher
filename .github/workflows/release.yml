name: 🚀 Release & Publish

# Triggered on v* tags (e.g. v1.0.0) or manually via workflow_dispatch
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0) — manual dispatch only"
        required: true

permissions:
  contents: write

jobs:
  debug-and-test:
    name: 🧪 Verify Debug Build
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    name: 📦 Build & Publish Release APK
    needs: debug-and-test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🏷️ Resolve Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"
          echo "📌 Resolved version: v$V"

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 🐘 Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14

      - name: 🔐 Prepare Release Signing Keystore
        env:
          KEYSTORE_RELEASE_B64: ${{ secrets.ANDROID_KEYSTORE_RELEASE_BASE64 }}
          KEYSTORE_FALLBACK_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          B64="${KEYSTORE_RELEASE_B64:-$KEYSTORE_FALLBACK_B64}"
          if [ -z "$B64" ]; then
            echo "::error::❌ Missing ANDROID_KEYSTORE_RELEASE_BASE64 (or KEYSTORE_BASE64) secret in GitHub Secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::❌ Missing KEYSTORE_PASSWORD secret in GitHub Secrets."
            exit 1
          fi
          JKS="$RUNNER_TEMP/release.jks"
          echo "$B64" | base64 -d > "$JKS"
          echo "KEYSTORE_FILE=$JKS" >> "$GITHUB_ENV"
          if [ -z "$KEY_ALIAS" ] || ! keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            DETECTED_ALIAS=$(keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i "PrivateKeyEntry" | head -n1 | cut -d',' -f1)
            [ -n "$DETECTED_ALIAS" ] && echo "KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
          fi
          echo "✅ Production keystore loaded from GitHub Secrets."

      - name: 🛠️ Build Release APK
        run: gradle assembleRelease -PversionName="$VERSION" -PversionCode="${{ github.run_number }}" --stacktrace

      - name: 📦 Prepare Release Artifacts & SHA-256 Checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cd dist
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done
          ls -lh

      - name: 📊 Generate Release Summary
        run: |
          APK_FILE=$(ls dist/*.apk | head -n 1)
          APK_NAME=$(basename "$APK_FILE")
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          APK_SHA256=$(cut -d' ' -f1 "$APK_FILE.sha256")
          {
            echo "### 🚀 Release Summary (\`$TAG\`)"
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| 🧪 **Debug & Unit Tests Gate** | ✅ Passed |"
            echo "| 🏷️ **Version** | \`$VERSION\` (\`versionCode: ${{ github.run_number }}\`) |"
            echo "| 📦 **APK** | \`$APK_NAME\` |"
            echo "| 📏 **Size** | \`$APK_SIZE\` |"
            echo "| 🔑 **Signing** | 🔐 Production Keystore (\`ANDROID_KEYSTORE_RELEASE_BASE64\`) |"
            echo "| 🔒 **SHA-256** | \`$APK_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Clean up Keystore from Runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AOSP Launcher ${{ env.TAG }}
          files: |
            dist/*.apk
            dist/*.apk.sha256
          generate_release_notes: true
