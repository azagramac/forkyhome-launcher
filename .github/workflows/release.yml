name: 🚀 Release

# Se lanza al subir una etiqueta tipo v1.0.0 o manualmente
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (ej. 1.0.0) — solo para lanzamiento manual"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 📦 Compilar y publicar Release
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: 📥 Descargar código fuente
        uses: actions/checkout@v7

      - name: 🏷️ Calcular versión
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"
          echo "📌 Versión detectada: v$V"

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 🐘 Configurar Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14

      - name: 🔐 Preparar firma de la aplicación
        env:
          KEYSTORE_RELEASE_B64: ${{ secrets.ANDROID_KEYSTORE_RELEASE_BASE64 }}
          KEYSTORE_FALLBACK_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          B64="${KEYSTORE_RELEASE_B64:-$KEYSTORE_FALLBACK_B64}"
          if [ -n "$B64" ]; then
            JKS="$RUNNER_TEMP/release.jks"
            echo "$B64" | base64 -d > "$JKS"
            echo "KEYSTORE_FILE=$JKS" >> "$GITHUB_ENV"
            if [ -z "$KEY_ALIAS" ] || ! keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              DETECTED_ALIAS=$(keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i "PrivateKeyEntry" | head -n1 | cut -d',' -f1)
              [ -n "$DETECTED_ALIAS" ] && echo "KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
            fi
            echo "SIGNING_MODE=🔐 Keystore de producción (ANDROID_KEYSTORE_RELEASE_BASE64)" >> "$GITHUB_ENV"
            echo "✅ Firmando con tu keystore de producción."
          else
            echo "::warning::⚠️ Sin secrets de firma: el APK se firma con una clave debug temporal y NO se podrá actualizar encima de versiones anteriores."
            echo "SIGNING_MODE=⚠️ Clave debug temporal" >> "$GITHUB_ENV"
            mkdir -p ~/.android
            [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🛠️ Compilar APK release
        run: gradle assembleRelease -PversionName="$VERSION" -PversionCode="${{ github.run_number }}" --stacktrace

      - name: 📦 Preparar artefactos y checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cd dist
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done
          ls -lh

      - name: 📊 Generar resumen de la Release
        run: |
          APK_FILE=$(ls dist/*.apk | head -n 1)
          APK_NAME=$(basename "$APK_FILE")
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          APK_SHA256=$(cut -d' ' -f1 "$APK_FILE.sha256")
          {
            echo "### 🚀 Resumen de Release (\`$TAG\`)"
            echo "| Campo | Valor |"
            echo "| :--- | :--- |"
            echo "| 🏷️ **Versión** | \`$VERSION\` (\`versionCode: ${{ github.run_number }}\`) |"
            echo "| 📦 **APK** | \`$APK_NAME\` |"
            echo "| 📏 **Tamaño** | \`$APK_SIZE\` |"
            echo "| 🔑 **Firma** | $SIGNING_MODE |"
            echo "| 🔒 **SHA-256** | \`$APK_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Limpiar keystore temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: 🚀 Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AOSP Launcher ${{ env.TAG }}
          files: |
            dist/*.apk
            dist/*.apk.sha256
          generate_release_notes: true
